<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0C0B09">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<!-- Its own manifest: the phone's opens "/", which would launch the tablet
     into the phone's page from its home screen. -->
<link rel="manifest" href="/tablet.webmanifest">
<title>Pit Crew field</title>
<!--
  The tablet page: what everyone is doing, on the tablet left of the wheel
  (17 Sep 2026). A dumb renderer - every word and figure comes from
  `pitcrew/ui/tablet.py`, over `race/field.py`, which reads George's own stop
  arithmetic. The one judgement made here is staleness, and the number for
  that comes from the server.

  Laid out for a glance from the wheel on a 350-nit panel: one row a car,
  big type, no thin grey. Our row stands out by its plate, not by colour.
  A car standing in its box says so in amber, because that is the one thing
  on this screen that is happening right now.

  **Two faces, and the payload says which** (20 Sep 2026). In a race, the
  timing tower above. In practice there is no field at all - `field.py` needs
  a race - and this page was a cover reading "no race running" beside three
  inert buttons, so it carries the practice board instead: the four corners,
  the three sectors, the lap face and the lamps. `compose_practice` words all
  of it; see `#practice` in the styles for why they share one grid cell.
-->
<style>
  :root {
    --ground: #0C0B09; --panel: #1E1B17; --edge: #38332B;
    --ink: #E8E4DC; --dim: #A8A298; --near: #F2C230; --good: #5FC27A; --over: #FF6B63;
    /* ---- the registers (DESIGN.md's marked set). Five of these six columns
       are READINGS - his place, his gap, the lap he pitted, the litres in and
       out, all off GT7's own board and pit columns. One is the app's
       OPINION, worked out from a burn that may not even be his. They were
       six identical grey heads, and the opinion was the widest of them.
       Rule 5, drawn rather than captioned. */
    --reg-measured: #A8A298;   /* read off GT7's screen */
    --reg-derived:  #B08BD8;   /* the app worked it out */
    --reg-absent:   #807870;   /* nothing read, and saying so */
    --label: "Bahnschrift Condensed", "DIN Condensed", "Roboto Condensed", "Arial Narrow", sans-serif;
    --number: "Cascadia Mono", ui-monospace, "Roboto Mono", "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ground); color: var(--ink);
    overflow: hidden; -webkit-user-select: none; user-select: none;
    -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
  body { padding: env(safe-area-inset-top) env(safe-area-inset-right)
                  env(safe-area-inset-bottom) env(safe-area-inset-left); }

  /* The table, and the buttons down the edge nearest the wheel. */
  /* **The row track is explicit.** Left implicit it is `auto`, so the shell
     sized to the table's max-content and the page overflowed a short panel:
     measured at 1280x800, the footnote never rendered and most of the PIT
     button was off the bottom edge. */
  #shell { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 19vw;
    grid-template-rows: minmax(0, 1fr); }
  #app { height: 100%; min-width: 0; display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
    padding: 1.6vh 1.4vw 1.6vh 2vw; row-gap: 1.2vh; }

  /* ---- the buttons: big, far apart, and each shows what the APP has */
  #buttons.stale { opacity: 0.55; }
  #buttons { position: relative; z-index: 6;
    display: grid; grid-template-rows: repeat(4, minmax(0, 1fr)); gap: 1.4vh;
    padding: 1.6vh 1.6vw 1.6vh 0; }
  .btn { position: relative; overflow: hidden; isolation: isolate; border: 3px solid var(--edge);
    border-radius: 1.4vh; background: var(--panel); color: var(--ink); touch-action: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: var(--label); font-weight: 700; text-transform: uppercase; text-align: center;
    padding: 1vh 0.6vw; -webkit-user-select: none; user-select: none; cursor: pointer; }
  .btn .what { font-size: 3vh; letter-spacing: 0.1em; color: var(--dim); }
  .btn .now { font-size: 6.4vh; line-height: 1.05; letter-spacing: 0.04em; }
  .btn .hint { font-size: 2.4vh; color: var(--dim); min-height: 1.1em; }
  .btn.on { border-color: var(--good); } .btn.on .now { color: var(--good); }
  .btn.off { border-color: var(--over); } .btn.off .now { color: var(--over); }
  .btn.save { border-color: var(--near); } .btn.save .now { color: var(--near); }
  .btn.armed { background: var(--near); border-color: var(--near); }
  .btn.armed .now, .btn.armed .what, .btn.armed .hint { color: var(--ground); }
  .btn.dead { opacity: 0.45; }
  .btn.pressed { transform: scale(0.97); }
  /* The hold: a fill that rises while the finger stays down. */
  .btn .fill { position: absolute; inset: 0; z-index: -1; background: rgba(242, 194, 48, 0.35);
    transform-origin: bottom; transform: scaleY(0); }

  /* ---- the three sessions, on the cover (21 Sep 2026). His ask: start a
     practice, a qualifying run or the race from the tablet. They live on the
     cover because the cover IS "no session running" - the one state in which
     starting one is the thing to do - and they go with it the moment one
     opens, so there is no Start to brush against at racing speed.

     A column, not a row: "Qualifying" beside two others is four words across
     a panel that may be the narrow way up, and these are pressed with a
     thumb from the seat. */
  #start { display: none; flex-direction: column; gap: 2vh; width: 62%; margin-top: 4vh; }
  #cover.start #start { display: flex; }
  #cover.start .big { font-size: 10vh; }
  .sbtn { font-family: var(--label); font-weight: 700; text-transform: uppercase;
    font-size: 4.6vh; letter-spacing: 0.08em; padding: 2.2vh 2vw; text-align: center;
    border: 3px solid var(--edge); border-radius: 1.4vh; background: var(--panel);
    color: var(--ink); touch-action: none; cursor: pointer;
    -webkit-user-select: none; user-select: none; }
  .sbtn.pressed { transform: scale(0.97); }
  /* **The app's answer to the last press, in its own words.** A refusal is
     the whole point of it - "Free Run is active", "Create an event before
     racing" - so it is drawn in the near ink and not the dim one. */
  #note { font-family: var(--label); font-weight: 700; font-size: 3.2vh;
    color: var(--near); margin-top: 3vh; min-height: 1.2em; max-width: 84%; }

  #head { display: flex; align-items: baseline; gap: 3vw; font-family: var(--label);
    font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
  #head .big { font-size: 6.4vh; line-height: 1; }
  /* **The read ages in the ink before it ages in the words.** "board read 6
     s ago" and "board read 1 s ago" were the same grey, and by the time the
     colour changed the reading was already too old to use. It walks to
     struck across the freshness window instead, so the instrument going
     quiet is visible before it has gone. */
  #board { margin-left: auto; font-size: 3.6vh;
    color: var(--aged-measured, var(--reg-measured)); }
  #board.stale { color: var(--near); }

  /* One grid for header and rows, so every column lines up down the table. */
  /* **The rows share the height the table has**, rather than each claiming a
     fixed one and the last of them falling off the bottom. A dozen cars on a
     short panel then draw a little tighter instead of not at all. */
  #table { display: grid; align-content: stretch; min-height: 0; overflow: hidden;
    grid-auto-rows: minmax(0, 1fr); row-gap: 0.6vh;
    /* **The opinion column gets the room, because it carries a sentence.**
       The five reading columns are a place, a name, a lap and two litres -
       fixed and short - while this one is "short - lifts or stops again ·
       our burn", and at 1.05fr it ellipsed the half that says what to DO
       about the car.
       The room comes from the four narrow columns, NOT from the driver: the
       first attempt took it from there and truncated the names instead
       ("MARTIN_…", "ZenPhilo…"), which is worse. A car he cannot name is a
       car he cannot find on the road, and a gap column holds "0.8" for two
       rows out of twelve.
       Sized to the LONGEST thing it can say - "short - lifts or stops again ·
       our burn", 38 characters - rather than to the common case. A column
       that fits four rows out of five is a column that hides the fifth, and
       the fifth is the car doing something unusual. */
    grid-template-columns: 5.5vw minmax(0, 1fr) 6vw 7.5vw 11.5vw minmax(0, 1.36fr);
    column-gap: 0; }
  /* The stop column starts clear of the gap figure beside it. */
  .row > .cell:nth-child(4), .th:nth-child(4) { padding-left: 1.8vw; }
  /* The opinion column is marked at its head and nowhere else: marking the
     cells too would put a colour on every row of a twelve-row table, which
     is decoration. One mark, at the top of the column it governs. */
  .th.col-says { color: var(--aged-derived, var(--reg-derived)); }
  .th { font-family: var(--label); font-weight: 700; font-size: 2.8vh; color: var(--aged-measured, var(--reg-measured));
    letter-spacing: 0.1em; text-transform: uppercase; padding: 0 0.8vw 0.4vh; white-space: nowrap; }
  .row { display: contents; }
  .cell { display: flex; flex-direction: column; justify-content: center; min-width: 0;
    padding: 0.4vh 0.8vw; border-top: 1px solid var(--edge); }
  .num { font-family: var(--number); font-weight: 700; font-variant-numeric: tabular-nums;
    font-size: 4.4vh; line-height: 1; white-space: nowrap; }
  .txt { font-family: var(--label); font-weight: 700; font-size: 4.6vh; line-height: 1;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .small { font-family: var(--label); font-weight: 700; font-size: 2.7vh; color: var(--dim);
    line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .right { align-items: flex-end; text-align: right; }
  /* The one seam where two columns can touch: the widest fill this table can
     draw ("10 → 99") ends hard against the first word of the opinion beside
     it. Space here rather than a rule - the table has no vertical rules, and
     one added for a single row would be the loudest thing on the screen. */
  .cell.col-fuel { padding-right: 1.8vw; }
  /* **And its figure is a step smaller, because it is not one figure.**
     Every other number column holds a single value; this one holds two and
     an arrow ("10 → 99"), and at the shared size the widest of them ran past
     its own column into the sentence beside it - `.cell` sets `min-width: 0`
     and does not clip, so an overflow here lands on top of the one column
     that says what to do about the car. Sized to what it actually holds. */
  .cell.col-fuel .num { font-size: 3.9vh; }

  /* Our row: a plate, not a colour. */
  .us .cell { background: var(--panel); border-top-color: var(--ink); border-bottom: 1px solid var(--ink); }
  .us .cell:first-child { border-left: 1px solid var(--ink); border-radius: 0.8vh 0 0 0.8vh; }
  .us .cell:last-child { border-right: 1px solid var(--ink); border-radius: 0 0.8vh 0.8vh 0; }

  .lane { display: inline-block; background: var(--near); color: var(--ground); border-radius: 0.6vh;
    padding: 0.3vh 0.6vw; font-family: var(--label); font-weight: 700; font-size: 3vh;
    letter-spacing: 0.06em; }
  .stops .txt { color: var(--good); }
  /* **A car the app cannot name is drawn as the absence it is.** The minted
     handle "Car #164" - a global counter, not his race number and not on the
     driver's screen anywhere - used to print in the measured ink beside real
     names. Same column, same case, same weight: nothing said one was read
     and the other invented. Absent ink and a smaller face, so the row is
     still there with its place, its stop and its fuel, and only the name
     reads as missing. */
  .txt.unnamed { color: var(--reg-absent); font-size: 3.4vh; letter-spacing: 0.06em; }
  /* **A gap the reader has lost is withdrawn, not dimmed.** It is the one
     figure on this page he acts on at racing speed, and one read before the
     crossing - or left behind by a board reader that has gone quiet -
     describes the car he has already passed. The cell draws "--" in the
     absent ink, which an empty cell cannot say: a car that is not one of the
     two either side of us has no interval box at all, and "no reading" and
     "nothing to read" are opposite claims (rule 3). Same ink as the unnamed
     driver, because it is the same statement about a different column. */
  .num.unread { color: var(--reg-absent); }

  #foot { font-family: var(--label); font-weight: 700; font-size: 3vh; color: var(--dim); }

  /* ---- the practice face (20 Sep 2026). His ask: *"in practice board on
     monitor should move to tablet as it has nothing on it"* - outside a race
     this page was a cover reading "no race running" and three inert buttons,
     while the only practice instrument in the app was on the monitor, which
     is now the lap rack.

     It shares the table's grid cell rather than sitting under it: one of the
     two is displayed and the other is `none`, so neither can add its height
     to the other's. The rack itself is NOT here - it is on the monitor,
     which is the half of his ask this page is the other side of. */
  #practice { display: none; grid-row: 2; min-height: 0; row-gap: 0.6vh;
    grid-template-rows: repeat(6, min-content); align-content: space-evenly; }
  #practice.on { display: grid; }
  #table.off { display: none; }
  .band { display: grid; column-gap: 1.2vw; }
  #p-faces, #p-sectors, #p-lights { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  #p-tyres { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  /* **The register is on the CAPTION, never on the value** - `driver_view`'s
     own rule, in its own words: the value's colour already means quick or
     slow, and a second meaning on the same pixels is a collision. */
  .pf { display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    min-width: 0; text-align: center; }
  .pf .cap { font-family: var(--label); font-weight: 700; font-size: 2.6vh;
    letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; max-width: 100%;
    color: var(--aged-measured, var(--reg-measured)); }
  .pf.r-derived .cap { color: var(--reg-derived); }
  .pf.r-absent .cap { color: var(--reg-absent); }
  .pf .val { font-family: var(--number); font-weight: 700; font-variant-numeric: tabular-nums;
    font-size: 8vh; line-height: 1; white-space: nowrap; }
  .pf .sub { font-family: var(--label); font-weight: 700; font-size: 2.4vh; color: var(--dim);
    min-height: 1.1em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .t-good .val { color: var(--good); } .t-urgent .val { color: var(--near); }
  /* A sector is a framed box, as it is on the monitor - three boxes read as
     three pieces of one lap where three bare numbers read as a row. */
  .pf.sector { border: 2px solid var(--edge); border-radius: 1vh; background: var(--panel);
    padding: 0.4vh 0.6vw; justify-content: center; }
  .pf.sector .val { font-size: 6vh; }
  /* The corners. **The number carries the state and there is no box round
     it** - the monitor's own note: on a glance instrument the furniture is
     what you read first and it is never the thing you needed. */
  .pf.tyre .val { font-size: 11vh; }
  .pf.tyre .cap { font-size: 2.2vh; letter-spacing: 0.3em; }
  .pf.tyre.s-over .val { color: var(--over); }
  .pf.tyre.s-near .val { color: var(--near); }
  .pf.tyre.s-missing .val { color: var(--dim); }
  .pf.tyre .sub { font-family: var(--number); font-size: 2.6vh; color: var(--near); }
  .pf.tyre.g-good .sub { color: var(--good); }
  .pcap { font-family: var(--label); font-weight: 700; font-size: 2.4vh; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--dim); text-align: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .plight { border: 2px solid var(--edge); border-radius: 0.8vh; padding: 0.4vh 0.6vw;
    text-align: center; font-family: var(--label); font-weight: 700; font-size: 3.2vh;
    letter-spacing: 0.08em; color: var(--dim); text-transform: uppercase;
    white-space: nowrap; overflow: hidden; }
  /* An unread lamp is not a lamp reading "no": `abs_light(None)` is "no
     reading" and `abs_light(False)` is "no lock", and both draw unlit. */
  .plight.unread { border-style: dashed; }
  .plight .lsub { display: block; font-family: var(--number); font-size: 2.2vh;
    letter-spacing: 0; text-transform: none; }

  /* **The cover takes the table, not the buttons.** Over the whole screen it
     swallowed every press - including George on/off, which is meant to work
     with no race running at all, which is exactly when the cover is up. */
  #cover { position: fixed; inset: 0 19vw 0 0; display: none; flex-direction: column; align-items: center;
    justify-content: center; background: var(--ground); text-align: center; padding: 4vh 4vw; }
  #cover.on { display: flex; }
  #cover .big { font-family: var(--label); font-weight: 700; letter-spacing: 0.1em; font-size: 16vh; line-height: 1; }
  #cover .why { font-family: var(--label); font-weight: 700; color: var(--dim); font-size: 4.5vh; margin-top: 2vh; }
  #cover.fault .big { color: var(--over); }

  @media (orientation: portrait) {
    #table { grid-template-columns: 11vw minmax(0, 1fr) 10vw 13vw minmax(0, 1.1fr); }
    .col-fuel { display: none; }
    .num { font-size: 3.4vw; } .txt { font-size: 3.6vw; } .small { font-size: 2.3vw; } .th { font-size: 2.2vw; }
    #head .big { font-size: 5vw; } #board { font-size: 2.8vw; }
    /* **The practice face sizes off the WIDTH here, as the table does.** Its
       columns are four corners across a panel that is now the narrow way up,
       and 11vh of Cascadia is wider than a quarter of it - the temperature
       would have run over the corner beside it, on the reading this face
       exists for. Nothing is dropped: there are only four columns and all
       four are the car. */
    /* Sized to the LONGEST thing each holds in its own column, not to the
       common case: a lap face is `1:44.900` in a third of the panel, and a
       split is `+13 vs FR  WIDENING` in a quarter of it. Measured at 800 x
       1280: at 6vw and 1.9vw the two lap times touched and the split
       ellipsed away the word that says which way it is going. */
    .pf .val { font-size: 4.6vw; } .pf.tyre .val { font-size: 7.5vw; }
    .pf.sector .val { font-size: 4.6vw; }
    .pf .cap, .pf.tyre .cap { font-size: 2vw; }
    .pf .sub { font-size: 1.7vw; } .pf.tyre .sub { font-size: 1.5vw; }
    .pcap { font-size: 2vw; }
    .plight { font-size: 2.4vw; } .plight .lsub { font-size: 1.8vw; }
  }
</style>
</head>
<body>
<div id="shell">
<div id="app">
  <div id="head">
    <div class="big" id="lap"></div>
    <div class="big" id="pos"></div>
    <div id="board"></div>
  </div>
  <div id="table"></div>
  <div id="practice">
    <div class="band" id="p-faces"></div>
    <div class="band" id="p-tyres"></div>
    <div class="pcap" id="p-tyrecap"></div>
    <div class="band" id="p-sectors"></div>
    <div class="pcap" id="p-secnote"></div>
    <div class="band" id="p-lights"></div>
  </div>
  <div id="foot"></div>
</div>
<div id="buttons">
  <div class="btn" id="b-george"><div class="what">George</div><div class="now">--</div><div class="hint">tap</div></div>
  <div class="btn" id="b-fuel"><div class="what">Beep</div><div class="now">--</div><div class="hint">tap</div></div>
  <div class="btn" id="b-pit"><div class="fill"></div><div class="what">Pit</div><div class="now">This lap</div><div class="hint">hold</div></div>
  <div class="btn" id="b-session"><div class="fill"></div><div class="what">Session</div><div class="now">--</div><div class="hint">hold to stop</div></div>
</div>
</div>
<div id="cover" class="on"><div class="big">PIT CREW</div><div class="why">connecting to the PC…</div>
  <div id="start">
    <div class="sbtn" id="s-practice">Practice</div>
    <div class="sbtn" id="s-quali">Qualifying</div>
    <div class="sbtn" id="s-race">Race</div>
  </div>
  <div id="note"></div></div>
<script>
(function () {
  "use strict";
  var POLL_MS = 500, TIMEOUT_MS = 1500;
  var staleAfter = 1.5, lastOk = null;
  var cover = document.getElementById("cover");
  // **The last column is derived and its heading says so** (rule 5): "Stop"
  // and "Fuel" are read off GT7's pit columns, "Fuel says" is worked out.
  // Whether the browser can interpolate two colours for us. Where it cannot,
  // the heads keep their register ink and only the words carry the age.
  var CAN_MIX = window.CSS && CSS.supports &&
                CSS.supports("color", "color-mix(in oklab, red, blue)");
  var BOARD_FRESH_S = 12;          // `race.news.BOARD_FRESH_S`, in the page

  // **The board's own age, walked into the ink.** Not the payload's `age_s`,
  // which is how long ago the PC SPOKE - the two are different questions and
  // conflating them is how a 250 ms publish of a two-minute-old reading came
  // to look current.
  function ageBoard(seconds) {
    if (!CAN_MIX) return;
    var fade = seconds == null ? 1
             : Math.max(0, Math.min(1, seconds / BOARD_FRESH_S));
    var pct = Math.round(Math.max(0, (fade - 0.25) / 0.75) * 72);
    var root = document.getElementById("app").style;
    root.setProperty("--aged-measured",
      "color-mix(in oklab, var(--reg-measured), var(--reg-absent) " + pct + "%)");
    root.setProperty("--aged-derived",
      "color-mix(in oklab, var(--reg-derived), var(--reg-absent) " + pct + "%)");
  }

  var SESSION_WORD = { practice: "Practice", quali: "Quali", race: "Race" };

  var HEAD = ["P", "Driver", "Gap", "Stop", "Fuel in → out", "Fuel says"];
  // Shorter where the column is narrow; the arrow in each row says in → out.
  HEAD[4] = "Fuel";

  function $(id) { return document.getElementById(id); }
  function show(big, why, fault, startable) {
    cover.querySelector(".big").textContent = big;
    cover.querySelector(".why").textContent = why;
    cover.className = "on" + (fault ? " fault" : "") + (startable ? " start" : "");
    // The buttons stay reachable beside the cover, but what they READ is
    // only as fresh as the last answer - so they say they are stale.
    $("buttons").classList.toggle("stale", !!fault);
  }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function cell(extra, main, mainCls, small) {
    var c = el("div", "cell" + (extra ? " " + extra : ""));
    if (main instanceof Node) c.appendChild(main);
    else c.appendChild(el("div", mainCls, main || ""));
    if (small) c.appendChild(el("div", "small", small));
    return c;
  }

  // **The practice face.** Everything here is already worded by
  // `tablet.compose_practice`; this only chooses a size and an ink, which is
  // the same division `strip.html` is built on. No temperature rule, no
  // threshold and no delta is decided in this file.
  function pf(cls, cap, val, sub) {
    var e = el("div", "pf" + (cls ? " " + cls : ""));
    e.appendChild(el("div", "cap", cap || ""));
    e.appendChild(el("div", "val", val || ""));
    e.appendChild(el("div", "sub", sub || ""));
    return e;
  }
  function fill(id, nodes) {
    var frag = document.createDocumentFragment();
    nodes.forEach(function (n) { frag.appendChild(n); });
    $(id).replaceChildren(frag);
  }
  function renderPractice(d) {
    $("lap").textContent = d.lap || "";
    $("pos").textContent = d.session || "";
    // **No board age here, and that is not an omission.** There is no board
    // read in practice - nothing on this face comes off GT7's timing screen
    // - so a "board read N s ago" would age a reading that does not exist.
    $("board").textContent = "";
    $("board").classList.remove("stale");
    // **And the race's walk is taken back off**, or a practice caption
    // inherits however faded the last board read left it: a fresh reading
    // drawn in the ink of a stale one is the trap the walk exists to avoid.
    var root = $("app").style;
    root.removeProperty("--aged-measured");
    root.removeProperty("--aged-derived");
    fill("p-faces", (d.faces || []).map(function (f) {
      return pf("t-" + (f.tone || "plain") + " r-" + (f.register || "measured"),
                f.caption, f.value, f.sub);
    }));
    fill("p-tyres", (d.tyres || []).map(function (t) {
      return pf("tyre s-" + (t.state || "missing")
                + " g-" + (t.gap_tone || "plain"), t.corner, t.value, t.gap);
    }));
    $("p-tyrecap").textContent = d.tyre_caption || "";
    fill("p-sectors", (d.sectors || []).map(function (s, i) {
      return pf("sector t-" + (s.tone || "plain"), "S" + (i + 1), s.value, s.sub);
    }));
    $("p-secnote").textContent = d.sector_note || "";
    fill("p-lights", (d.lights || []).map(function (l) {
      var e = el("div", "plight" + (l.unread ? " unread" : ""),
                 l.word + (l.unread ? " ?" : ""));
      if (l.ink) { e.style.background = l.ink; e.style.borderColor = l.ink;
                   e.style.color = "var(--ground)"; }
      e.appendChild(el("span", "lsub", l.sub || ""));
      return e;
    }));
    $("foot").textContent = "";
  }

  function render(d) {
    if (typeof d.stale_after_s === "number") staleAfter = d.stale_after_s;
    // **Idle is where a session is started, and the poll having answered is
    // the whole proof the PC is there.** `age_s` is how long ago the numbers
    // were published, and between sessions nothing publishes at all - so
    // gating the Start buttons on it would take them away a second and a half
    // after the last session closed, which is exactly when they are wanted.
    if (d.idle) {
      // **Start is offered only where nothing is open.** An armed race is
      // idle here - there is no field until the green - and a session that
      // has just opened is idle for the one tick before the board publishes.
      // Offering Start in either is offering to open a second session, which
      // is the bind-over-a-bind the app refuses anyway: better not to ask.
      var sess = d.controls && d.controls.session;
      if (sess === "race") show("ARMED", "race armed - waiting for the green", false);
      else if (sess) show("PIT CREW", SESSION_WORD[sess] + " running - waiting for the numbers", false);
      else show("PIT CREW", "no session running", false, true);
      return;
    }
    if (d.empty) { show("PIT CREW", "waiting for the first numbers", false); return; }
    if (d.age_s === null || d.age_s > staleAfter) {
      show("NO DATA", "Pit Crew has stopped updating", true); return;
    }
    // **Which face, chosen once and both ways.** A payload switching kind
    // mid-session - practice into a race, which is every race night - must
    // turn the other face OFF, not merely draw over it: two faces in one
    // grid cell is two sets of numbers about two sessions.
    var practising = d.kind === "practice";
    $("practice").classList.toggle("on", practising);
    $("table").classList.toggle("off", practising);
    if (practising) { renderPractice(d); cover.className = ""; return; }
    $("lap").textContent = d.lap || "";
    $("pos").textContent = d.position || "";
    $("board").textContent = d.board || "";
    $("board").classList.toggle("stale", !!d.board_stale);
    ageBoard(d.board_age_s);

    // Rebuilt whole each answer: a dozen rows twice a second, and a row
    // patched in place is a row that can show one car's fuel beside
    // another's name for a frame.
    var table = document.createDocumentFragment();
    HEAD.forEach(function (h, i) {
      table.appendChild(el("div", "th" + (i === 2 ? " right" : "")
                           + (i === 4 ? " col-fuel" : "")
                           + (i === 5 ? " col-says" : ""), h));
    });
    (d.rows || []).forEach(function (r) {
      var row = el("div", "row" + (r.us ? " us" : ""));
      row.appendChild(cell("", r.place, "num"));
      // `=== false` and not `!r.named`: a page cached from before the field
      // existed would otherwise draw every driver as unnamed.
      row.appendChild(cell("", r.name, "txt" + (r.named === false ? " unnamed" : "")));
      // `=== true` and not truthiness, for the same reason `named` is tested
      // `=== false`: a page cached from before the field carried this would
      // otherwise decide for itself what an absent flag meant.
      row.appendChild(cell("right", r.gap, "num" + (r.gap_unread === true ? " unread" : "")));
      row.appendChild(cell("", r.lane ? el("span", "lane", "IN LANE") : r.stop, "num"));
      row.appendChild(cell("col-fuel", r.fuel, "num"));
      row.appendChild(cell(r.tone === "stops" ? "stops" : "", r.prediction, "txt", r.detail));
      table.appendChild(row);
    });
    $("table").replaceChildren(table);
    $("foot").textContent = (d.left_off ? d.left_off + " more not shown · " : "") + (d.why || "");
    cover.className = "";
  }

  function poll() {
    var ctl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctl) ctl.abort(); }, TIMEOUT_MS);
    fetch("/tablet/state", { cache: "no-store", signal: ctl ? ctl.signal : undefined })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (d) {
        // **Stamped after the render, not before.** Stamped first, a render
        // that threw kept the watchdog satisfied and the last numbers on
        // screen for ever - the one failure CLAUDE.md 7 says survives into a
        // decision, in the one place the page can still catch it.
        render(d);
        drawButtons(d && d.controls);
        lastOk = performance.now();
      })
      .catch(function () { /* the watchdog says so */ })
      .then(function () { clearTimeout(timer); setTimeout(poll, POLL_MS); });
  }
  setInterval(function () {
    if (lastOk !== null && (performance.now() - lastOk) / 1000 > staleAfter + 1) {
      show("NO DATA", "lost the connection to the PC", true);
    }
  }, POLL_MS);
  if (navigator.wakeLock) {
    var ask = function () { navigator.wakeLock.request("screen").catch(function () {}); };
    ask();
    document.addEventListener("visibilitychange", function () { if (!document.hidden) ask(); });
  }
  // ---------------------------------------------------------------- buttons
  // **A press asks for a setting, never a flip**, so a retry or a double tap
  // cannot undo itself; and a button only ever shows what the app sent back.
  // **A press asks for a setting, never a flip**, so a retry or a double tap
  // cannot undo itself; and a button only ever shows what the app sent back.
  //
  // **And it carries no code** (21 Sep 2026, his call: it is a page on his
  // own Wi-Fi). There was a six-digit one, stored in the browser and asked
  // for at the moment of the first press. What actually kept a stray page on
  // the network from posting one is still here and is not the code: the
  // request is `application/json`, so it is not a CORS simple request, and
  // the preflight it needs is answered 404.
  var HOLD_MS = 500, NOTE_MS = 15000, controls = null;

  function press(action, value) {
    fetch("/tablet/press", { method: "POST", cache: "no-store",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: action, value: value }) })
      .catch(function () { /* the button does not change, which says so */ });
  }

  // **The app's answer to the last press.** Accepted is not done - the press
  // returns before the app has touched it - so what happened comes back on
  // the polled state like everything else here.
  //
  // `note_n` is why this is not just "draw `note`": the same refusal twice
  // is two presses, and a page that compared the WORDS would answer the
  // second one with the sentence already on screen and no sign it had been
  // heard. The count ticks on every answer the app gives, so a repeat
  // re-arms the line and its timer.
  var noteN = null, noteTimer = null;
  function drawNote(c) {
    var n = c && typeof c.note_n === "number" ? c.note_n : null;
    if (n === noteN) return;
    noteN = n;
    clearTimeout(noteTimer); noteTimer = null;
    var words = (c && c.note) || "";
    $("note").textContent = words;
    // The app drops it at the same age, but nothing republishes between
    // sessions - so on this page the timer is what retires it.
    if (words) {
      noteTimer = setTimeout(function () { $("note").textContent = ""; }, NOTE_MS);
    }
  }

  function drawButtons(c) {
    controls = c || null;
    var racing = !!(c && c.racing);
    var g = $("b-george"), f = $("b-fuel"), p = $("b-pit"), s = $("b-session");
    g.classList.toggle("on", !!(c && c.george)); g.classList.toggle("off", !!(c && !c.george));
    g.querySelector(".now").textContent = c ? (c.george ? "On" : "Off") : "--";
    g.querySelector(".hint").textContent = c && !c.george ? "beep stays on" : "tap";
    f.classList.toggle("save", !!(c && c.fuel === "save"));
    f.classList.toggle("dead", !racing);
    f.querySelector(".now").textContent = c && c.fuel ? (c.fuel === "save" ? "Save" : "Full") : "--";
    f.querySelector(".hint").textContent = c && c.fuel_held ? "held - tap to swap" : "tap to hold";
    p.classList.toggle("armed", !!(c && c.pit));
    p.classList.toggle("dead", !racing);
    p.querySelector(".now").textContent = c && c.pit ? "Boxing " + c.pit : "This lap";
    p.querySelector(".hint").textContent = !c || !c.pit ? "hold" :
      (c.pit_cancellable ? "hold to cancel" : "in this lap");
    // **What is OPEN, not what is under way.** A race armed on the grid is a
    // session and is not racing; the two keys are separate for that reason,
    // and this button is the one that can close it.
    var open = c && c.session;
    s.classList.toggle("on", !!open);
    s.classList.toggle("dead", !open);
    s.querySelector(".now").textContent = open ? SESSION_WORD[open] : "None";
    s.querySelector(".hint").textContent = open ? "hold to stop" : "none running";
    drawNote(c);
  }

  function tap(el, fn) {
    // **A finger that slid off does not press.** With touch capture
    // `pointerleave` only fires at release, so the release has to check
    // where it happened rather than trusting a leave to have cancelled it.
    var down = false;
    el.addEventListener("pointerdown", function (e) {
      e.preventDefault(); down = true; el.classList.add("pressed");
    });
    el.addEventListener("pointerup", function (e) {
      el.classList.remove("pressed");
      var box = el.getBoundingClientRect();
      var inside = e.clientX >= box.left && e.clientX <= box.right &&
                   e.clientY >= box.top && e.clientY <= box.bottom;
      if (down && inside) fn();
      down = false;
    });
    el.addEventListener("pointercancel", function () {
      down = false; el.classList.remove("pressed");
    });
  }
  tap($("b-george"), function () { if (controls) press("george", !controls.george); });
  tap($("b-fuel"), function () {
    if (controls && controls.racing) press("fuel", controls.fuel === "save" ? "full" : "save");
  });
  // **Starting is a tap; both are under the cover.** There is no session to
  // interrupt and no wheel in his hands at the moment these are on screen -
  // the hold is for the two buttons that are reachable with a race running.
  tap($("s-practice"), function () { press("session", "practice"); });
  tap($("s-quali"), function () { press("session", "quali"); });
  tap($("s-race"), function () { press("session", "race"); });

  // **A hold, so a brush of the hand on the way to the wheel cannot declare
  // a stop - or end the race.** One implementation for both: two copies of a
  // 500 ms timer and its fill animation is two places for the fill to be
  // left running. `ready` decides whether this press means anything at all,
  // and it is asked on the way down, so a dead button never starts the fill.
  function hold(id, ready, fire) {
    var el = $(id), fill = el.querySelector(".fill"), timer = null, anim = null;
    function stop() {
      clearTimeout(timer); timer = null;
      if (anim) { anim.cancel(); anim = null; }
      el.classList.remove("pressed");
    }
    el.addEventListener("pointerdown", function (e) {
      e.preventDefault();
      if (!ready()) return;
      el.classList.add("pressed");
      if (fill.animate) {
        anim = fill.animate([{ transform: "scaleY(0)" }, { transform: "scaleY(1)" }],
                            { duration: HOLD_MS, easing: "linear", fill: "forwards" });
      }
      timer = setTimeout(function () { timer = null; fire(); stop(); }, HOLD_MS);
    });
    ["pointerup", "pointercancel", "pointerleave"].forEach(function (ev) { el.addEventListener(ev, stop); });
  }
  hold("b-pit", function () { return !!(controls && controls.racing); },
       function () { press("pit", !controls.pit); });
  // George says the stop back either way; a session ended says so by the
  // cover coming up, which is the same answer from the other side.
  hold("b-session", function () { return !!(controls && controls.session); },
       function () { press("session", "stop"); });

  poll();
})();
</script>
</body>
</html>
