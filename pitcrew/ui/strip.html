<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pit Crew">
<meta name="theme-color" content="#0C0B09">
<!-- **The home-screen icon** (the driver, 16 Sep 2026, having installed the
     page as a PWA). Without these iOS uses a screenshot of the page, which
     on this page is a black rectangle. `apple-touch-icon` is the one iOS
     reads; the manifest is what Android and Chrome read. Both are served by
     `strip_server` from `pitcrew/ui/`, cut from `icon-src.png` by
     `tools/make_icons.py`. -->
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<title>Pit Crew strip</title>
<!--
  The strip page: his own car, on the phone right of the wheel. A dumb
  renderer on purpose - every word, number and tone is decided by
  `pitcrew/ui/strip.py` from the functions the Qt board uses. The one
  judgement made here is staleness, and even that number comes from the
  server (`stale_after_s`). Numbers never stay on screen once they stop.

  **Laid out like a lap timer** (his photo, 17 Sep 2026): last lap and the
  best across the top, the delta as a flood across the middle, the lap bottom
  left - and where the timer has the time of day, the burn against the plan.

  **Motion as signal**, and each movement means one thing:
  * a digit that changes **rolls** - down when the figure fell, up when it
    rose - so a delta coming back reads as coming back before it is read;
  * the band **wipes** to its new colour: red slow, green quick, and amber
    only for an instruction (NOW, fuel short, the release count);
  * a lamp lighting wipes its fill down in the same 180 ms stroke.
  Reduced motion, or the page in the background, swaps without moving.
-->
<style>
  :root {
    --ground: #0C0B09; --panel: #1E1B17; --edge: #38332B;
    --ink: #E8E4DC; --dim: #9A948A; --near: #F2C230; --good: #4FB06A; --over: #FF6B63;
    /* The band's own red and green: muted, like the timer's, so a whole band
       of white figures stays readable at 5:1 and more. */
    --quick: #2E7A44; --slow: #A63E39;
    /* ---- the registers (DESIGN.md's marked set), carried by the payload.
       Three white numbers in a row - the lap he DROVE, the lap the plan ASKS
       for, the lap the app PROJECTS - are three different claims, and they
       were drawn identically. The words on the captions always said which;
       the ink says it without being read, which is the whole point at speed.

       **Ink is the SECOND channel, never the only one** - "LAST LAP",
       "TARGET LAP" and "VS TARGET · PROJ" carry it in words already.

       On the collision with `--good`: crayon is 80° of hue from that green,
       and the stronger argument is the rack's - the two never share a role.
       A register ink is only ever a caption; `--good` is only ever a value.
       Nothing on this face is both. */
    --reg-measured: #9A948A;   /* came off the stream, or off GT7's screen */
    --reg-declared: #9DCB57;   /* the plan he approved asks for it */
    --reg-derived:  #B08BD8;   /* the app worked it out - a projection */
    --reg-absent:   #807870;   /* nothing to show, and saying so */
    --label: "Bahnschrift Condensed", "DIN Condensed", "Arial Narrow", sans-serif;
    --number: "Cascadia Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --wipe: 180ms cubic-bezier(0.33, 1, 0.68, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ground); color: var(--ink);
    overflow: hidden; -webkit-user-select: none; user-select: none;
    -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
  body { padding: env(safe-area-inset-top) env(safe-area-inset-right)
                  env(safe-area-inset-bottom) env(safe-area-inset-left); }

  #app { height: 100%; display: grid; padding: 1.2vh 2.4vw; row-gap: 1.2vh;
    grid-template-rows: auto minmax(0, 1fr) auto; }

  /* ---- a figure: caption over value, sub under */
  .fig { display: flex; flex-direction: column; min-width: 0; }
  /* A figure's caption wears its register. `--reg` defaults to measured, so
     a payload from an older app - or any figure nobody has classified - reads
     exactly as it always did rather than as a claim nobody made. */
  .fig, #band { --reg: var(--reg-measured); }
  .fig[data-reg="declared"], #band[data-reg="declared"] { --reg: var(--reg-declared); }
  .fig[data-reg="derived"],  #band[data-reg="derived"]  { --reg: var(--reg-derived); }
  .fig[data-reg="absent"],   #band[data-reg="absent"]   { --reg: var(--reg-absent); }

  .cap { font-family: var(--label); font-weight: 700; color: var(--aged, var(--reg)); text-transform: uppercase;
    letter-spacing: 0.08em; font-size: 5.2vh; line-height: 1; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; padding-top: 0.12em; }
  .val { font-family: var(--number); font-weight: 700; line-height: 1.02; white-space: nowrap;
    font-variant-numeric: tabular-nums; }
  /* **Sized to its figure, not its column.** A stretched value's scrollWidth
     is never less than the column, so the fitter shrank "last lap" to its
     floor while "plan lap", aligned to the right, stayed full size. */
  #last .val, #lap .val { align-self: flex-start; }
  #best .val { align-self: flex-end; }
  #burn .val { align-self: center; }
  .sub { font-family: var(--label); font-weight: 700; color: var(--dim); font-size: 4.4vh;
    line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 1.1em; }
  .good .val { color: var(--good); } .urgent .val { color: var(--near); }

  /* ---- top: last lap left, the best (or the plan's lap) right */
  #top { display: grid; grid-template-columns: 1fr 1fr; column-gap: 3vw; }
  #top .val { font-size: 19vh; }
  #best { align-items: flex-end; text-align: right; }
  #best.good .cap { color: var(--good); }

  /* ---- the band */
  #band { position: relative; isolation: isolate; min-height: 0; border-radius: 1.2vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: var(--panel); overflow: hidden; padding: 0.5vh 2vw; }
  #band::before { content: ""; position: absolute; inset: 0; z-index: -1;
    background: var(--fill, transparent); clip-path: inset(0 0 100% 0);
    transition: clip-path var(--wipe); }
  #band.quick, #band.slow, #band.act { --shown: 1; }
  #band.quick::before, #band.slow::before, #band.act::before { clip-path: inset(0 0 0 0); }
  #band.quick { --fill: var(--quick); } #band.slow { --fill: var(--slow); }
  #band.act { --fill: var(--near); }
  /* **The band's mark is on its edge, because the band floods.** Every other
     caption keeps its register ink; this one is white-on-red or white-on-
     green for most of a race, where a coloured word is unreadable. So the
     register moves to a marked edge the flood cannot swallow - which is the
     moulded groove this world already draws depth with, in the register's
     ink instead of TREAD. */
  #band::after { content: ""; position: absolute; top: 0; left: 0; right: 0;
    height: 0.5vh; background: var(--aged, var(--reg)); z-index: 1; }
  #band .cap { position: absolute; top: 1vh; left: 2vw; font-size: 4.4vh; color: var(--dim); }
  #band .val { font-size: 38vh; line-height: 0.95; max-width: 100%; }
  #band .sub { font-size: 4.6vh; }
  /* 0.88, not 0.78: at 0.78 over the green this line measured 3.9:1, just
     under the bar for text this size. */
  #band.quick .cap, #band.slow .cap, #band.quick .sub, #band.slow .sub { color: rgba(255, 255, 255, 0.88); }
  #band.act .val, #band.act .cap, #band.act .sub { color: var(--ground); transition: color 0s 70ms; }

  /* ---- bottom: the lap, the burn, the lamps */
  #bottom { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; column-gap: 3vw;
    align-items: end; }
  #bottom .val { font-size: 15vh; }
  #lap .val { font-size: 17vh; }
  #burn { align-items: center; text-align: center; }
  #burn .sub { font-size: 5vh; }
  #lights { display: flex; flex-direction: column; gap: 0.8vh; align-self: stretch; justify-content: flex-end; }
  .light { position: relative; isolation: isolate; overflow: hidden; border: 2px solid var(--edge);
    border-radius: 0.8vh; padding: 0.3vh 1vw; min-width: 11vw; text-align: center;
    font-family: var(--label); font-weight: 700; font-size: 3.4vh; letter-spacing: 0.08em;
    color: var(--dim); line-height: 1.15; text-transform: uppercase; white-space: nowrap; }
  .light::before { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--fill, transparent);
    clip-path: inset(0 0 100% 0); transition: clip-path var(--wipe); }
  .light.lit::before { clip-path: inset(0 0 0 0); }
  .light.unread { border-style: dashed; }
  .light.lit { color: var(--ground); transition: color 0s 70ms; }

  .ch { display: inline-block; position: relative; overflow: hidden; vertical-align: top; white-space: pre; }
  .ch > .g { display: inline-block; }
  .ch > .g.out { position: absolute; left: 0; top: 0; }

  #cover { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center;
    justify-content: center; background: var(--ground); text-align: center; padding: 4vh 4vw; }
  #cover.on { display: flex; }
  #cover .big { font-family: var(--label); font-weight: 700; letter-spacing: 0.1em; font-size: 22vh; line-height: 1; }
  #cover .why { font-family: var(--label); font-weight: 700; color: var(--dim); font-size: 5vh; margin-top: 2vh; }
  #cover.fault .big { color: var(--over); }

  @media (orientation: portrait) {
    .cap { font-size: 3.6vw; } .sub { font-size: 3.4vw; }
    #top .val { font-size: 12vw; } #band .val { font-size: 26vw; } #band .cap { font-size: 3.4vw; }
    #bottom .val { font-size: 10vw; } #lap .val { font-size: 11vw; } .light { font-size: 2.8vw; }
    #cover .big { font-size: 14vw; } #cover .why { font-size: 4vw; }
  }
  /* **The escalation** (his call: signal, then urgency). The fill breathes
     only when the instruction has run out of laps to be obeyed in - NOW, or
     the last whole lap. Two seconds a cycle, and it never touches the figure
     or its position: a number that moves is a number he has to find again.
     The amber stays amber; what changes is that the panel is no longer
     still, which the edge of the eye reads without being pointed at it. */
  @keyframes last-call {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.62; }
  }
  #band.act.last-call::before { animation: last-call 2s ease-in-out infinite; }

  @media (prefers-reduced-motion: reduce) {
    #band::before, .light::before, #band.act .val, .light.lit { transition: none; }
    /* The escalation is information, so it is not deleted - it stops moving
       and holds the state the movement was carrying. */
    #band.act.last-call::before { animation: none; opacity: 1; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="fig" id="last"><div class="cap"></div><div class="val"></div></div>
    <div class="fig" id="best"><div class="cap"></div><div class="val"></div></div>
  </div>
  <div id="band"><div class="cap"></div><div class="val"></div><div class="sub"></div></div>
  <div id="bottom">
    <div class="fig" id="lap"><div class="cap"></div><div class="val"></div></div>
    <div class="fig" id="burn"><div class="cap"></div><div class="val"></div><div class="sub"></div></div>
    <div id="lights">
      <div class="light" id="l0"></div><div class="light" id="l1"></div><div class="light" id="l2"></div>
    </div>
  </div>
</div>
<div id="cover" class="on"><div class="big">PIT CREW</div><div class="why">connecting to the PC…</div></div>
<script>
(function () {
  "use strict";
  var POLL_MS = 250, TIMEOUT_MS = 1000, ROLL_MS = 260;
  // What "there are no laps left to do this in" looks like in the band: the
  // box call's own NOW, and the last whole lap before it.
  var LAST_CALL = /^(NOW|1)$/;
  // Whether the browser can interpolate two colours for us. Where it cannot,
  // `--aged` is never set and every caption simply keeps its register ink -
  // the reading still goes to NO DATA at the same second, so nothing is lost
  // but the warning that it is coming.
  var CAN_MIX = window.CSS && CSS.supports &&
                CSS.supports("color", "color-mix(in oklab, red, blue)");
  var staleAfter = 1.5;                 // replaced by the server's own figure
  var lastOk = null, last = null;        // the last answer, for a refit
  var cover = document.getElementById("cover");
  var covered = true;                   // numbers come back without rolling
  var reduce = window.matchMedia ? window.matchMedia("(prefers-reduced-motion: reduce)") : null;

  function $(id) { return document.getElementById(id); }
  function moving() { return !(reduce && reduce.matches) && !document.hidden; }

  function show(big, why, fault) {
    cover.querySelector(".big").textContent = big;
    cover.querySelector(".why").textContent = why;
    cover.className = "on" + (fault ? " fault" : "");
    covered = true;
  }

  // Shrink a figure until it fits its room, from its CSS size down to a floor.
  // Only when the text or the room changed.
  function fit(el, room, floor) {
    var key = (el.dataset.text || el.textContent) + "|" + Math.round(room) + "|" +
              window.innerWidth + "x" + window.innerHeight;
    if (el.dataset.fitted === key) return;
    el.style.fontSize = "";
    var css = parseFloat(getComputedStyle(el).fontSize), size = css;
    while (el.scrollWidth > room && size > css * floor) {
      size *= 0.93; el.style.fontSize = size + "px";
    }
    el.dataset.fitted = key;
  }

  // ---- digits
  function glyph(ch) { var g = document.createElement("span"); g.className = "g"; g.textContent = ch; return g; }
  function cell(ch) { var c = document.createElement("span"); c.className = "ch"; c.appendChild(glyph(ch)); return c; }
  function number(text) {
    var n = parseFloat(String(text).replace(/[^0-9.+\-]/g, ""));
    return isFinite(n) ? n : null;
  }
  function rollCell(c, ch, dir) {
    var old = c.lastElementChild, next = glyph(ch);
    old.classList.add("out");
    c.appendChild(next);
    var timing = { duration: ROLL_MS, easing: "cubic-bezier(0.16, 1, 0.3, 1)" };
    old.animate([{ transform: "translateY(0)", opacity: 1 },
                 { transform: "translateY(" + (-dir * 100) + "%)", opacity: 0 }], timing)
       .onfinish = function () { old.remove(); };
    next.animate([{ transform: "translateY(" + (dir * 100) + "%)", opacity: 0 },
                  { transform: "translateY(0)", opacity: 1 }], timing);
  }
  // Rolls only where it is the same figure, the same shape, and on screen
  // before; anything else is simply set.
  function setValue(el, text, roll) {
    var prev = el.dataset.text;
    if (prev === text) return;
    el.dataset.text = text;
    if (!(roll && moving() && prev != null && prev.length === text.length &&
          el.children.length === text.length && el.animate)) {
      el.replaceChildren();
      for (var i = 0; i < text.length; i++) el.appendChild(cell(text[i]));
      return;
    }
    var a = number(prev), b = number(text);
    var dir = (a !== null && b !== null && b < a) ? -1 : 1;
    for (var j = 0; j < text.length; j++) {
      if (prev[j] !== text[j]) rollCell(el.children[j], text[j], dir);
    }
  }

  // ---- a figure
  function fig(id, data, room) {
    var el = $(id);
    if (!data) { el.style.visibility = "hidden"; el.dataset.subject = ""; return; }
    el.style.visibility = "visible";
    var same = el.dataset.subject === (data.subject || data.caption || "");
    el.dataset.subject = data.subject || data.caption || "";
    el.classList.toggle("good", data.tone === "good");
    el.classList.toggle("urgent", data.tone === "urgent");
    el.dataset.reg = data.register || "measured";
    el.querySelector(".cap").textContent = data.caption || "";
    var sub = el.querySelector(".sub");
    if (sub) sub.textContent = data.sub || "";
    var val = el.querySelector(".val");
    setValue(val, data.value || "", !covered && same);
    fit(val, room, 0.4);
  }

  function band(data) {
    var el = $("band");
    var same = el.dataset.subject === data.subject;
    el.dataset.subject = data.subject || "";
    // **The band's colour is the band's meaning.** Amber is an instruction
    // (`strip.ACT_NOW`, decided server-side); red and green are the delta.
    var act = data.act === true;
    el.classList.toggle("act", act);
    el.classList.toggle("slow", !act && data.tone === "urgent");
    el.classList.toggle("quick", !act && data.tone === "good");
    el.dataset.reg = data.register || "measured";
    // **The last lap before the stop escalates.** An instruction that has
    // run out of laps is a different thing from one three laps away, and it
    // was the same amber at the same size. The pulse is on the FILL, not on
    // the figure: a number that moves is a number he has to re-read.
    el.classList.toggle("last-call", act && LAST_CALL.test(data.value || ""));
    el.querySelector(".cap").textContent = data.caption || "";
    el.querySelector(".sub").textContent = data.sub || "";
    var val = el.querySelector(".val");
    setValue(val, data.value || "", !covered && same);
    fit(val, el.clientWidth * 0.94, 0.3);
  }

  function light(id, data) {
    var el = $(id);
    if (!data) { el.style.visibility = "hidden"; return; }
    el.style.visibility = "visible";
    var lit = !!data.ink;
    // The ink stays set when the lamp goes out, so the fill that retracts is
    // the colour it was.
    if (lit) { el.style.setProperty("--fill", data.ink); el.style.borderColor = data.ink; }
    else { el.style.borderColor = ""; }
    el.classList.toggle("lit", lit);
    // **An unread lamp is not a lamp reading "no".** `abs_light(None)` is
    // "no reading" and `abs_light(False)` is "no lock"; both draw unlit, so
    // without this the phone shows a missing reading as a measured negative
    // (rule 3). The server decides which is which.
    el.textContent = data.word + (data.unread ? " ?" : "");
    el.classList.toggle("unread", !!data.unread);
  }

  // **A reading does not fall off a cliff, so neither should the ink.**
  // The page went from fully lit to NO DATA in one tick, and the second
  // before the cliff looked exactly like the second after a fresh read. The
  // captions now walk their register ink toward struck across the life of
  // the read, so an instrument going quiet is visible BEFORE it is gone -
  // which is the whole of rule 10's "log the accepts, not only the refusals"
  // pointed at the driver instead of at the log.
  function age(seconds) {
    if (!CAN_MIX) return;
    var fade = Math.max(0, Math.min(1, (seconds || 0) / (staleAfter || 1.5)));
    // Nothing moves over the first third: a poll is 250 ms and a read this
    // fresh is simply current, not ageing.
    var pct = Math.round(Math.max(0, (fade - 0.33) / 0.67) * 78);
    document.getElementById("app").style.setProperty(
      "--aged", "color-mix(in oklab, var(--reg), var(--reg-absent) " + pct + "%)");
  }

  function render(d) {
    if (typeof d.stale_after_s === "number") staleAfter = d.stale_after_s;
    if (d.idle) { show("PIT CREW", "no session running", false); return; }
    if (d.empty) { show("PIT CREW", "waiting for the first numbers", false); return; }
    if (d.age_s === null || d.age_s > staleAfter) {
      show("NO DATA", "Pit Crew has stopped updating", true); return;
    }
    var half = $("top").clientWidth / 2 - 16;
    fig("last", d.last, half);
    fig("best", d.best, half);
    band(d.centre);
    fig("lap", d.lap, $("bottom").clientWidth * 0.2);
    fig("burn", d.burn, $("burn").clientWidth);
    var lights = d.lights || [];
    light("l0", lights[0]); light("l1", lights[1]); light("l2", lights[2]);
    age(d.age_s);
    cover.className = "";
    covered = false;
  }

  function poll() {
    var ctl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctl) ctl.abort(); }, TIMEOUT_MS);
    fetch("/strip/state", { cache: "no-store", signal: ctl ? ctl.signal : undefined })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (d) {
        // Stamped after the render: a render that threw would otherwise keep
        // the watchdog happy and the stale numbers on screen for ever.
        render(d); lastOk = performance.now(); last = d;
      })
      .catch(function () { /* the watchdog below says so */ })
      .then(function () { clearTimeout(timer); setTimeout(poll, POLL_MS); });
  }

  // **The watchdog.** A fetch that never answers renders nothing, so the
  // numbers on screen would stay - this is what takes them away.
  setInterval(function () {
    if (lastOk === null) return;
    if ((performance.now() - lastOk) / 1000 > staleAfter) {
      show("NO DATA", "lost the connection to the PC", true);
    }
  }, POLL_MS);

  // **A turn of the phone changes the room every figure was fitted to**, and
  // nothing re-fits until the next answer - which left two figures drawn over
  // each other for a poll. The last answer is drawn again at once.
  window.addEventListener("resize", function () {
    ["last", "best", "band", "lap", "burn"].forEach(function (id) {
      var el = $(id).querySelector ? $(id).querySelector(".val") : null;
      if (el) delete el.dataset.fitted;
    });
    if (last) render(last);
  });

  // Keep the screen on where the browser allows it (secure pages only, so
  // usually not here - set Auto-Lock to Never on the phone instead).
  if (navigator.wakeLock) {
    var ask = function () { navigator.wakeLock.request("screen").catch(function () {}); };
    ask();
    document.addEventListener("visibilitychange", function () { if (!document.hidden) ask(); });
  }
  poll();
})();
</script>
</body>
</html>
