<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pit Crew">
<meta name="theme-color" content="#0C0B09">
<title>Pit Crew strip</title>
<!--
  The strip page. A dumb renderer on purpose: every word, number and tone on
  it is decided by `pitcrew/ui/strip.py` from the same functions the Qt board
  uses, so this file only lays out and colours what it is handed. The one
  judgement it makes is staleness, and even that number comes from the server
  (`stale_after_s`). Numbers are never left on screen once they stop updating.
-->
<style>
  :root {
    --ground: #0C0B09; --panel: #1E1B17; --edge: #38332B;
    --ink: #E8E4DC; --dim: #9A948A; --near: #F2C230; --good: #4FB06A; --over: #FF6B63;
    --label: "Bahnschrift Condensed", "SF Pro Display", -apple-system, system-ui, sans-serif;
    --number: "Cascadia Mono", "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ground); color: var(--ink);
    overflow: hidden; -webkit-user-select: none; user-select: none;
    -webkit-text-size-adjust: 100%; }
  body { padding: env(safe-area-inset-top) env(safe-area-inset-right)
                  env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #app { height: 100%; display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 1.2vh; padding: 1.5vh 1.5vw; }
  #main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.45fr) minmax(0, 1fr); gap: 1.2vw; min-height: 0; }
  .item { display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-width: 0; min-height: 0; border-radius: 12px; padding: 0.5vh 0.6vw; }
  .item.centre { background: var(--panel); border: 3px solid var(--edge); }
  .item.centre.urgent { border-color: var(--near); }
  .item.centre.good { border-color: var(--good); }
  .cap { font-family: var(--label); font-weight: 600; color: var(--dim); letter-spacing: 0.18em;
    font-size: 4.2vh; line-height: 1.1; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; max-width: 100%; }
  .val { font-family: var(--number); font-weight: 700; line-height: 1; white-space: nowrap;
    font-variant-numeric: tabular-nums; font-size: 24vh; max-width: 100%; }
  .centre .val { font-size: 34vh; }
  .sub { font-family: var(--label); color: var(--dim); font-size: 3.8vh; line-height: 1.15;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .urgent .val, .urgent .sub { color: var(--near); }
  .good .val, .good .sub { color: var(--good); }
  #bar { display: flex; gap: 1.2vw; align-items: stretch; height: 20vh; }
  .light { flex: 0 0 auto; min-width: 15vw; border: 3px solid var(--edge); border-radius: 10px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 1vw; }
  .light .word { font-family: var(--label); font-weight: 700; letter-spacing: 0.12em; font-size: 7vh; color: var(--dim); line-height: 1; }
  .light .lsub { font-family: var(--label); font-size: 3vh; color: var(--dim); white-space: nowrap; }
  #extra { flex: 1 1 auto; flex-direction: row; gap: 2vw; justify-content: flex-end; padding-right: 1vw; }
  #extra .val { font-size: 13vh; }
  #extra .cap { font-size: 3.6vh; }
  #cover { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center;
    justify-content: center; background: var(--ground); text-align: center; padding: 4vh 4vw; }
  #cover.on { display: flex; }
  #cover .big { font-family: var(--label); font-weight: 700; letter-spacing: 0.1em; font-size: 22vh; line-height: 1; }
  #cover .why { font-family: var(--label); color: var(--dim); font-size: 5vh; margin-top: 2vh; }
  #cover.fault .big { color: var(--over); }
  @media (orientation: portrait) {
    #main { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1.4fr) minmax(0, 1fr); }
    .item.centre { grid-column: 1 / 3; grid-row: 1; }
    .val { font-size: 9vh; } .centre .val { font-size: 14vh; }
    .cap { font-size: 2vh; } .sub { font-size: 1.8vh; }
    #bar { height: 12vh; flex-wrap: wrap; } .light .word { font-size: 3.5vh; } .light .lsub { font-size: 1.5vh; }
    #extra .val { font-size: 6vh; } #extra .cap { font-size: 1.8vh; }
    #cover .big { font-size: 10vh; } #cover .why { font-size: 2.4vh; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="main">
    <div class="item" id="left"><div class="cap"></div><div class="val"></div><div class="sub"></div></div>
    <div class="item centre" id="centre"><div class="cap"></div><div class="val"></div><div class="sub"></div></div>
    <div class="item" id="right"><div class="cap"></div><div class="val"></div><div class="sub"></div></div>
  </div>
  <div id="bar">
    <div class="light" id="l0"><div class="word"></div><div class="lsub"></div></div>
    <div class="light" id="l1"><div class="word"></div><div class="lsub"></div></div>
    <div class="light" id="l2"><div class="word"></div><div class="lsub"></div></div>
    <div class="item" id="extra"><div><div class="cap"></div><div class="sub"></div></div><div class="val"></div></div>
  </div>
</div>
<div id="cover" class="on"><div class="big">PIT CREW</div><div class="why">connecting to the PC…</div></div>
<script>
(function () {
  "use strict";
  var POLL_MS = 250, TIMEOUT_MS = 1000;
  var staleAfter = 1.5;                 // replaced by the server's own figure
  var lastOk = null;                    // performance.now() of the last good answer
  var cover = document.getElementById("cover");

  function show(big, why, fault) {
    cover.querySelector(".big").textContent = big;
    cover.querySelector(".why").textContent = why;
    cover.className = "on" + (fault ? " fault" : "");
  }
  function hideCover() { cover.className = ""; }

  // Shrink a value until it fits its block, from the CSS size down.
  // Only when the text or the room changed: refitting four times a second
  // resets the size and reflows the page on every poll.
  function fit(el) {
    var box = el.parentElement, room = box.clientWidth * 0.96;
    var key = el.textContent + "|" + Math.round(room) + "|" + window.innerHeight;
    if (el.dataset.fitted === key) return;
    el.style.fontSize = "";
    var size = parseFloat(getComputedStyle(el).fontSize);
    while (el.scrollWidth > room && size > 8) { size *= 0.92; el.style.fontSize = size + "px"; }
    el.dataset.fitted = key;
  }

  function item(id, data) {
    var el = document.getElementById(id);
    if (!data) { el.style.visibility = "hidden"; return; }
    el.style.visibility = "visible";
    el.classList.remove("urgent", "good");
    if (data.tone === "urgent" || data.tone === "good") el.classList.add(data.tone);
    el.querySelector(".cap").textContent = data.caption || "";
    el.querySelector(".sub").textContent = data.sub || "";
    var val = el.querySelector(".val");
    if (val.textContent !== data.value) val.textContent = data.value;
    fit(val);
  }

  function light(id, data) {
    var el = document.getElementById(id);
    if (!data) { el.style.visibility = "hidden"; return; }
    el.style.visibility = "visible";
    var lit = !!data.ink;
    el.style.background = lit ? data.ink : "transparent";
    el.style.borderColor = lit ? data.ink : "";
    var word = el.querySelector(".word"), sub = el.querySelector(".lsub");
    word.textContent = data.word;
    sub.textContent = data.sub || "";
    word.style.color = sub.style.color = lit ? "var(--ground)" : "";
  }

  function render(d) {
    if (typeof d.stale_after_s === "number") staleAfter = d.stale_after_s;
    if (d.idle) { show("PIT CREW", "no session running", false); return; }
    if (d.empty) { show("PIT CREW", "waiting for the first numbers", false); return; }
    if (d.age_s === null || d.age_s > staleAfter) {
      show("NO DATA", "Pit Crew has stopped updating", true); return;
    }
    item("centre", d.centre); item("left", d.left); item("right", d.right);
    item("extra", d.extra);
    var lights = d.lights || [];
    light("l0", lights[0]); light("l1", lights[1]); light("l2", lights[2]);
    hideCover();
  }

  function poll() {
    var ctl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctl) ctl.abort(); }, TIMEOUT_MS);
    fetch("/strip/state", { cache: "no-store", signal: ctl ? ctl.signal : undefined })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (d) { lastOk = performance.now(); render(d); })
      .catch(function () { /* the watchdog below says so */ })
      .then(function () { clearTimeout(timer); setTimeout(poll, POLL_MS); });
  }

  // **The watchdog.** A fetch that never answers renders nothing, so the
  // numbers on screen would stay - this is what takes them away.
  setInterval(function () {
    if (lastOk === null) return;
    if ((performance.now() - lastOk) / 1000 > staleAfter) {
      show("NO DATA", "lost the connection to the PC", true);
    }
  }, POLL_MS);

  // Keep the screen on where the browser allows it (secure pages only, so
  // usually not here - set Auto-Lock to Never on the phone instead).
  if (navigator.wakeLock) {
    var ask = function () { navigator.wakeLock.request("screen").catch(function () {}); };
    ask();
    document.addEventListener("visibilitychange", function () { if (!document.hidden) ask(); });
  }
  poll();
})();
</script>
</body>
</html>
